<!DOCTYPE html>
<html lang="fr" dir="ltr">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>NMS – Transport universitaire Béjaïa</title>
  <style>
    :root {
      --bg: #f4f6f2;
      --card: #fff;
      --ink: #17261f;
      --mute: #5d6b63;
      --line: #dfe4dc;
      --map: #e9eee6;
      --road: #d2d9cf;
      --ok: #0e7c4a;
      --late: #b86e00;
      --bad: #c8372d;
      --bus: #f2b400;
      box-sizing: border-box;
      padding-top: env(safe-area-inset-top, 0px);
      padding-bottom: env(safe-area-inset-bottom, 0px)
    }

    @media (prefers-color-scheme:dark) {
      :root:not([data-theme="light"]) {
        --bg: #101a15;
        --card: #18251e;
        --ink: #e8efe9;
        --mute: #9aaba1;
        --line: #2a3a31;
        --map: #16231c;
        --road: #26362d;
        --ok: #3ccf8a;
        --late: #f0a830;
        --bad: #ff6b5e
      }
    }

    :root[data-theme="dark"] {
      --bg: #101a15;
      --card: #18251e;
      --ink: #e8efe9;
      --mute: #9aaba1;
      --line: #2a3a31;
      --map: #16231c;
      --road: #26362d;
      --ok: #3ccf8a;
      --late: #f0a830;
      --bad: #ff6b5e
    }

    * {
      box-sizing: border-box
    }

    html,
    body {
      height: 100%;
      margin: 0
    }

    html {
      scroll-padding-top: env(safe-area-inset-top, 0px)
    }

    body {
      background: var(--bg);
      color: var(--ink);
      font: 15px/1.4 "Segoe UI", Tahoma, system-ui, sans-serif;
      display: flex;
      flex-direction: column;
      max-width: 600px;
      margin: 0 auto
    }

    header {
      padding: 10px 16px;
      display: flex;
      align-items: center;
      gap: 10px
    }

    h1 {
      margin: 0;
      font: 800 22px/1 "Bahnschrift", "Arial Narrow", system-ui, sans-serif
    }

    header small {
      color: var(--mute);
      flex: 1;
      font-size: 12px
    }

    .lg button {
      border: 1px solid var(--line);
      background: var(--card);
      color: var(--ink);
      padding: 4px 8px;
      font: inherit;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer
    }

    .lg button[aria-pressed=true] {
      background: var(--ink);
      color: var(--bg)
    }

    main {
      flex: 1;
      overflow: auto;
      padding: 0 16px 12px
    }

    .sub {
      color: var(--mute);
      font-size: 13px
    }

    .seg {
      display: flex;
      gap: 8px;
      margin-bottom: 8px;
      flex-wrap: wrap
    }

    .chip,
    .btn {
      border: 1.5px solid var(--line);
      background: var(--card);
      color: var(--ink);
      border-radius: 10px;
      padding: 8px 12px;
      font: inherit;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer
    }

    .chip[aria-pressed=true] {
      background: var(--ink);
      color: var(--bg);
      border-color: var(--ink)
    }

    .btn.p {
      background: var(--ok);
      border-color: var(--ok);
      color: #fff
    }

    .btn.r {
      color: var(--bad);
      border-color: var(--bad)
    }

    button:focus-visible,
    select:focus-visible,
    input:focus-visible {
      outline: 3px solid var(--bus);
      outline-offset: 2px
    }

    .map {
      height: 400px;
      border-radius: 14px;
      border: 1px solid var(--line);
      position: relative;
      z-index: 0
    }

    .bm {
      background: #f2b400;
      color: #2a2100;
      font: 800 11px/17px sans-serif;
      border: 1.5px solid #2a2100;
      border-radius: 6px;
      text-align: center;
      width: 30px;
      height: 20px
    }

    .stop {
      cursor: pointer
    }

    .panel {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 12px 14px;
      margin-top: 10px
    }

    .panel h2 {
      margin: 0 0 4px;
      font-size: 16px
    }

    .bus {
      display: grid;
      grid-template-columns: auto 1fr auto;
      gap: 10px;
      align-items: center;
      padding: 8px 0;
      border-top: 1px solid var(--line)
    }

    .badge {
      background: var(--bus);
      color: #2a2100;
      font-weight: 800;
      border-radius: 8px;
      padding: 4px 8px;
      min-width: 40px;
      text-align: center
    }

    .eta {
      font: 800 20px "Bahnschrift", system-ui, sans-serif;
      text-align: end
    }

    .ok {
      color: var(--ok)
    }

    .late {
      color: var(--late)
    }

    .bad {
      color: var(--bad)
    }

    .st {
      font-size: 13px;
      font-weight: 700
    }

    .bar {
      height: 5px;
      background: var(--line);
      border-radius: 3px;
      margin-top: 4px;
      overflow: hidden
    }

    .bar i {
      display: block;
      height: 100%;
      background: currentColor
    }

    .row {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 8px;
      align-items: center
    }

    select,
    input[type=text] {
      border: 1.5px solid var(--line);
      background: var(--card);
      color: var(--ink);
      border-radius: 10px;
      padding: 8px;
      font: inherit
    }

    .note {
      padding: 8px 0;
      border-top: 1px solid var(--line)
    }

    .note small {
      color: var(--mute)
    }

    .kpi {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px
    }

    .kpi div {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 10px
    }

    .kpi b {
      display: block;
      font: 800 22px "Bahnschrift", system-ui, sans-serif
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px
    }

    td,
    th {
      padding: 6px 4px;
      text-align: start;
      border-top: 1px solid var(--line)
    }

    nav {
      display: flex;
      border-top: 1px solid var(--line);
      background: var(--card)
    }

    nav button {
      flex: 1;
      border: 0;
      background: none;
      color: var(--mute);
      padding: 12px 4px;
      font: inherit;
      font-weight: 700;
      cursor: pointer
    }

    nav button[aria-selected=true] {
      color: var(--ink);
      box-shadow: inset 0 3px 0 var(--bus)
    }

    #toast {
      position: fixed;
      left: 50%;
      top: calc(10px + env(safe-area-inset-top, 0px));
      transform: translate(-50%, -160%);
      background: var(--ink);
      color: var(--bg);
      padding: 10px 16px;
      border-radius: 12px;
      max-width: 90%;
      font-weight: 600;
      transition: transform .3s;
      z-index: 5
    }

    #toast.on {
      transform: translate(-50%, 0)
    }

    @media (prefers-reduced-motion:reduce) {
      #toast {
        transition: none
      }
    }

    [hidden] {
      display: none !important
    }
  </style>

</head>

        </div>

      </div>
      <div id="uK" hidden>
        <div class="panel">
          <h2 data-i="buy"></h2>
          <div class="row"><label><input type="radio" name="pr" value="30" checked> <span data-i="t1"></span></label>
          </div>
          <div class="row"><label><input type="radio" name="pr" value="600"> <span data-i="t2"></span></label></div>

            </select><button class="btn p" id="pay" data-i="pay"></button></div>
          <div id="tkt"></div>
        </div>
        <div class="panel">
          <h2 data-i="hist"></h2>
          <div id="hist"></div>
        </div>
      </div>
      <div id="uA" hidden>
        <div class="panel">
          <h2 data-i="al"></h2>
          <div id="notes"></div>
        </div>
      </div>
    </section>
    <section id="vd" hidden>
      <div class="panel">
        <h2 data-i="d"></h2>
        <div class="row"><select id="dsel"></select><button class="btn p" id="on" data-i="start"></button><button
            class="btn" id="offb" data-i="end"></button></div>

      <div class="panel">
        <h2 data-i="inc"></h2>
        <div class="row"><button class="btn r" data-a="fail" data-i="pFail"></button><button class="btn" data-a="late"

            data-a="block" data-i="pBlock"></button><button class="btn p" data-a="ok" data-i="pOk"></button></div>
      </div>
      <div class="panel">
        <h2 data-i="pax"></h2>
        <div class="row"><button class="btn" id="pm1">−</button><b id="pv"></b><button class="btn" id="pp1">+</button>
        </div>
        <div class="row"><label><input type="checkbox" id="dof"> <span data-i="offl"></span></label></div>
      </div>
    </section>
    <section id="vs" hidden>
      <div class="kpi" id="kpi"></div>
      <div id="m2" class="map" style="margin-top:10px"></div>
      <div class="panel">
        <h2 data-i="fleet"></h2>
        <table id="fleet"></table>
      </div>
      <div class="panel">
        <h2 data-i="inc"></h2>
        <div id="incs"></div>
      </div>
      <div class="panel">
        <h2 data-i="msgh"></h2>
        <div class="row"><select id="ssel"></select><input type="text" id="mt" data-i="ph"><button class="btn" id="ms"
            data-i="send"></button></div>
      </div>
    </section>
  </main>
